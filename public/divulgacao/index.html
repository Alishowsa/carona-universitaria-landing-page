<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Baixar QR Code | Carona Universitária</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 32px 16px; min-height: 100vh; display: grid; place-items: center; font-family: 'Segoe UI', Arial, sans-serif; background: #f8f8f5; color: #191919; }
      main { width: 100%; max-width: 460px; padding: 32px; background: white; border: 1px solid #e5e5e0; border-radius: 20px; text-align: center; }
      h1 { font-size: 26px; margin: 0 0 12px; }
      p { color: #606060; line-height: 1.6; }
      img { display: block; width: 260px; max-width: 100%; height: auto; margin: 24px auto; }
      .button { display: block; padding: 16px; margin-top: 12px; border-radius: 10px; background: #ffbf00; color: #191919; text-decoration: none; font-weight: 700; }
      .secondary { background: white; border: 1px solid #c9c9c3; }
      a:focus-visible { outline: 3px solid #805a00; outline-offset: 4px; }
      .hint { font-size: 14px; margin-bottom: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>QR Code para divulgação</h1>
      <p>Compartilhe o Carona Universitária. Este código abre a landing page no celular.</p>
      <img src="/divulgacao/qr-code-carona.png" width="984" height="984" alt="QR Code para acessar a landing page do Carona Universitária" />
      <a class="button" href="/divulgacao/qr-code-carona.png" download="qr-code-carona.png">Baixar QR Code em PNG</a>
      <a class="button secondary" href="/divulgacao/qr-code-carona.svg" download="qr-code-carona.svg">Baixar SVG para impressão</a>
      <p class="hint">Se o celular abrir a imagem, toque e segure para salvá-la ou use a opção de compartilhar.</p>
    </main>
  </body>
</html>
